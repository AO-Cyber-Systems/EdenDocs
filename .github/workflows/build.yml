name: build
on:
  push:
    branches: [eden-main]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CCACHE_DIR: /home/runner/.ccache
    steps:
      - uses: actions/checkout@v4

      # BUILD-03: Node 20 LTS pinned — ubuntu-latest no longer ships Node 20
      # in its toolcache (removed 2026-05-26; default is 22.x).
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify Node 20
        run: node -v | grep -E '^v20\.'

      # BUILD-03: ccache persisted across runs. CCACHE_DIR is set job-wide so
      # ccache (XDG default would be ~/.cache/ccache) and this path agree.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('configure.ac') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Install build dependencies + system POCO 1.12.5p2
        run: ./scripts/eden/build-deps.sh

      - name: Configure ccache
        run: ccache -M 1G && ccache -z

      - name: Fetch prebuilt engine assets (BUILD-01 fast path, no engine/ compile)
        run: ./scripts/eden/fetch-engine-assets.sh

      - name: Configure and build (asserts system-POCO fallback — BUILD-02)
        run: ./scripts/eden/build.sh

      - name: ccache stats
        run: ccache -s

      # BUILD-04: native port 9980 — port 8080 is banned project-wide.
      - name: Smoke test /hosting/discovery + /hosting/capabilities on 9980
        run: ./scripts/eden/smoke-test.sh

      # BRAND-01..06: mechanical rebrand gate — static dist sweep + MPL +
      # no-phone-home assertions (runtime checks live in smoke-test.sh).
      - name: Verify EdenDocs branding + trademark/MPL gates
        run: ./scripts/eden/verify-branding.sh

      # --- AUTH-01..04 (objective 03, TRD 03-04): additive steps only below
      # this line — never reorder or modify the steps above. ---
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: wopi-host/go.sum

      # Private module reads (go.aocyber.ai) through the aocyber-ci-read App token.
      - id: ci-read
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: ${{ vars.CI_READ_APP_OWNER }}
      - name: Git credential helper for module and package reads
        env:
          CI_READ_TOKEN: ${{ steps.ci-read.outputs.token }}
          CI_READ_OWNER: ${{ vars.CI_READ_APP_OWNER }}
        run: |
          echo "::add-mask::${CI_READ_TOKEN}"
          helper="$RUNNER_TEMP/ci-read-git-credential.sh"
          cat > "$helper" <<'EOF'
          #!/bin/sh
          [ "$1" = get ] || exit 0
          while IFS='=' read -r k v; do
            [ -z "$k" ] && break
            case "$k" in host) h=$v ;; path) p=$v ;; protocol) pr=$v ;; esac
          done
          [ "$pr" = https ] && [ "$h" = github.com ] || exit 0
          o=${p%%/*}
          [ "$(printf '%s' "$o" | tr 'A-Z' 'a-z')" = "$(printf '%s' "$CI_READ_OWNER" | tr 'A-Z' 'a-z')" ] || exit 0
          echo username=x-access-token
          echo "password=$CI_READ_TOKEN"
          EOF
          chmod 700 "$helper"
          git config --global credential."https://github.com".useHttpPath true
          git config --global credential."https://github.com".helper "$helper"
          {
            echo "CI_READ_TOKEN=${CI_READ_TOKEN}"
            echo "CI_READ_OWNER=${CI_READ_OWNER}"
            echo "GOPRIVATE=go.aocyber.ai"
          } >> "$GITHUB_ENV"

      # Full behavioral AUTH chain against the freshly built native coolwsd:
      # AOID OIDC (fake IdP) -> WOPI token mint -> coolwsd doc session ->
      # proof-verified CheckFileInfo/GetFile/PutFile -> alias_groups trust
      # (positive + negative). Ports: 9980 coolwsd, 8091 wopi-host, 8092
      # fake-aoid (8080 banned project-wide).
      - name: WOPI host end-to-end (AUTH-01..04, native coolwsd on 9980 + wopi-host on 8091)
        run: COOLWSD_MODE=native ./wopi-host/scripts/wopi-e2e.sh
