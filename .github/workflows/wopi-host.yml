name: wopi-host
on:
  push:
    branches: [eden-main]
    paths:
      - 'wopi-host/**'
      - '.github/workflows/wopi-host.yml'
  workflow_dispatch:

concurrency:
  group: wopi-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wopi-host:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: ci-read
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.CI_READ_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: ${{ vars.CI_READ_APP_OWNER }}
      - name: Git credential helper for module and package reads
        env:
          CI_READ_TOKEN: ${{ steps.ci-read.outputs.token }}
          CI_READ_OWNER: ${{ vars.CI_READ_APP_OWNER }}
        run: |
          echo "::add-mask::${CI_READ_TOKEN}"
          helper="$RUNNER_TEMP/ci-read-git-credential.sh"
          cat > "$helper" <<'EOF'
          #!/bin/sh
          [ "$1" = get ] || exit 0
          while IFS='=' read -r k v; do
            [ -z "$k" ] && break
            case "$k" in host) h=$v ;; path) p=$v ;; protocol) pr=$v ;; esac
          done
          [ "$pr" = https ] && [ "$h" = github.com ] || exit 0
          o=${p%%/*}
          [ "$(printf '%s' "$o" | tr 'A-Z' 'a-z')" = "$(printf '%s' "$CI_READ_OWNER" | tr 'A-Z' 'a-z')" ] || exit 0
          echo username=x-access-token
          echo "password=$CI_READ_TOKEN"
          EOF
          chmod 700 "$helper"
          git config --global credential."https://github.com".useHttpPath true
          git config --global credential."https://github.com".helper "$helper"
          {
            echo "CI_READ_TOKEN=${CI_READ_TOKEN}"
            echo "CI_READ_OWNER=${CI_READ_OWNER}"
            echo "GOPRIVATE=go.aocyber.ai"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache-dependency-path: wopi-host/go.sum

      - name: Download modules
        working-directory: wopi-host
        run: go mod download

      - name: Vet
        working-directory: wopi-host
        run: go vet ./...

      - name: Build
        working-directory: wopi-host
        run: go build ./...

      - name: Test (race)
        working-directory: wopi-host
        run: go test -race ./... -count=1
